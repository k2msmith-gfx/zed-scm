name = "scm Scheme"
grammar = "scheme"
# `.sld` is R7RS's library suffix and scm has 37 of them; same reader, same
# queries. `.ss` is left to the Scheme extension, which claims it.
path_suffixes = ["scm", "sld"]
line_comments = ["; ", ";; "]
tab_size = 2
hard_tabs = false
autoclose_before = ")]"

# Offered in the debugger's New Process modal for a .scm buffer.
debuggers = ["scm"]

# `:` and `&` are word characters because `:at` and `&opt` are single tokens
# in scm and a double-click should take the whole thing. The rest is the
# R7RS identifier set minus the characters a delimiter already breaks on.
word_characters = [
    "-", "_", "!", "?", "*", "/", "+", "<", ">", "=", ":", "&", "%", "^", "~", "$", ".",
]

brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
